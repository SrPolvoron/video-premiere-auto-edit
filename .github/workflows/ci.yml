name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install FFmpeg for integration tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,audio]"
      - name: Syntax and lint checks
        run: |
          python -m compileall -q src tests scripts
          python -m ruff check src tests scripts
      - name: Unit and available integration tests
        run: python -m pytest -q --cov=autoeditor_local --cov-report=term-missing
      - name: Public source hygiene
        run: python scripts/check_public_tree.py
      - name: Build distributions
        run: python -m build
