[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoeditor-local"
version = "0.1.0a1"
description = "Local-first footage indexing and editable rough cuts for Adobe Premiere Pro"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "AutoEditor Local contributors"}]
keywords = ["video", "rough-cut", "local-ai", "ffmpeg", "xmeml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = ["numpy>=1.26,<3", "Pillow>=10.4,<13"]

[project.optional-dependencies]
audio = ["librosa>=0.10.2,<1.1"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
autoeditor = "autoeditor_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoeditor_local = ["priority_profiles.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: invokes local FFmpeg on synthetic media"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["E501"]
